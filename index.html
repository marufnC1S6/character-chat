<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Character Chat</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}*{box-sizing:border-box}html,body{width:100%;max-width:100%;overflow-x:hidden}body{margin:0;background:#0c1020;color:#f6f7ff}button,input,textarea{font:inherit}button{border:0;border-radius:13px;padding:12px 16px;background:#465fe0;color:white;font-weight:650}button:disabled{opacity:.5}header{flex-shrink:0;min-width:0;gap:8px;height:66px;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#181e35}header strong{min-width:0;font-size:17px}header button{flex-shrink:0;background:#303957}#app{width:100%;max-width:100vw;overflow:hidden;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}#chat{width:100%;min-width:0;flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;padding:16px}article{white-space:pre-wrap;overflow-wrap:anywhere;max-width:min(86%,100%);width:fit-content;background:#272f4b;padding:12px 16px;border-radius:19px;margin:9px 0;line-height:1.55}article.user{background:#3755aa;margin-left:auto}footer{width:100%;min-width:0;display:flex;gap:8px;padding:10px 12px;background:#181e35}footer button{flex-shrink:0}footer input{min-width:0;flex:1;background:#2a304b;color:white;border:1px solid #535e81;border-radius:15px;padding:12px}#busy{font-size:12px;color:#b8c3e8;padding:4px 16px;min-height:23px}#overlay{position:fixed;inset:0;background:#0c1020;z-index:10;display:flex;align-items:center;justify-content:center;padding:25px}#overlay[hidden]{display:none}#panel{width:min(100%,420px);text-align:center}#logo{font-size:52px;margin-bottom:15px}h1{font-size:25px;margin:0 0 12px}#phase{color:#bac4e7;line-height:1.6;overflow-wrap:anywhere}progress{width:100%;height:12px;accent-color:#7185ff;margin:18px 0}#diagnostics{white-space:pre-wrap;text-align:left;font-size:11px;max-height:140px;overflow:auto;color:#c7d1ee;background:#202842;border-radius:10px;padding:10px;margin-top:14px}#copyDiag{margin-top:10px;background:#39476e}#retry{margin-top:16px}#retry[hidden]{display:none}dialog{width:min(92vw,440px);background:#1b2239;color:white;border:1px solid #4d5879;border-radius:18px;padding:20px}dialog::backdrop{background:#0009}dialog input,dialog textarea{width:100%;margin:8px 0 16px;background:#2a304b;color:white;border:1px solid #536080;border-radius:10px;padding:10px}dialog textarea{height:100px}small{color:#aeb9db}
</style></head><body><div id="app"><header><strong>✦ Character Chat</strong><button id="settingsBtn">⚙ 設定</button></header><div id="chat" aria-live="polite"></div><div id="busy"></div><footer><input id="entry" placeholder="メッセージを入力" autocomplete="off"><button id="send">送信</button></footer></div>
<div id="overlay"><div id="panel"><div id="logo">✦</div><h1>Character Chat</h1><p id="phase">AIの起動を準備しています…</p><progress id="progress" max="100"></progress><div><small id="detail">初回はモデルのダウンロードが必要です</small></div><button id="retry" hidden>もう一度試す</button><div id="diagnostics" hidden></div><button id="copyDiag" hidden>診断結果をコピー</button></div></div>
<dialog id="settings"><h2>キャラクター設定</h2><label>名前<input id="charName"></label><label>性格・口調<textarea id="persona"></textarea></label><button id="save">保存</button> <button id="close">閉じる</button><p><button id="clearChat" type="button">会話履歴を削除</button></p><p><small>会話履歴はこのSafariに保存されます。閲覧データを削除すると失われる場合があります。</small></p></dialog>
<script type="module">
const el=id=>document.getElementById(id);
const KEY="character-chat-v1";
let data;
try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{data={}}
if(!Array.isArray(data.messages))data.messages=[];if(!data.upgraded3B){data.messages=[];data.upgraded3B=true;}if(!data.freshChatV9){data.messages=[];data.freshChatV9=true;}
const obsolete=/AIを読み込んでください|AIを読み込む.*押して|AIが未読み込みです|先に設定から|何かありましたら|何かお手伝い|お知らせください|何をお手伝い|何かありましたら/;
data.messages=data.messages.filter(m=>!(m.role==="assistant"&&obsolete.test(m.content||"")));
try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}
data.name=data.name||"アオ";
data.persona=data.persona||"明るく親しみやすい友達のような口調。自然な日本語で会話する。";
const MODEL_ID="Qwen2.5-3B-Instruct-q4f16_1-MLC";let engine=null,initPromise=null,working=false;let diag=[];function logDiag(x){diag.push(x);el("diagnostics").textContent=diag.join("\n");}el("copyDiag").addEventListener("click",()=>navigator.clipboard.writeText(diag.join("\n")).catch(()=>{}));
function saveData(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){el("busy").textContent="履歴の保存に失敗しました: "+e.message}}
function render(){el("chat").replaceChildren();for(const m of data.messages){const a=document.createElement("article");a.className=m.role==="user"?"user":"assistant";a.textContent=m.content;el("chat").append(a)}el("chat").scrollTop=el("chat").scrollHeight}
function status(msg,percent){el("phase").textContent=msg;if(Number.isFinite(percent)){el("progress").value=Math.min(100,Math.max(0,percent))}else{el("progress").removeAttribute("value")}}
function showError(e){logDiag("ERROR: "+String(e?.message||e));el("diagnostics").hidden=false;el("copyDiag").hidden=false;el("overlay").hidden=false;status("AIの起動に失敗しました");el("detail").textContent=String(e?.message||e);el("retry").hidden=false;el("progress").hidden=true;el("retry").disabled=false}
async function initialize(){
if(engine)return engine;
if(initPromise)return initPromise;
diag=[];el("diagnostics").hidden=true;el("copyDiag").hidden=true;el("overlay").hidden=false;el("retry").hidden=true;el("progress").hidden=false;el("detail").textContent="Safariを開いたままお待ちください";status("ブラウザの対応状況を確認中…");
initPromise=(async()=>{
if(!navigator.gpu)throw Error("WebGPU APIが見つかりません");logDiag("WebGPU API: yes");let adapter=null;for(const opt of [{powerPreference:"high-performance"},{}]){try{adapter=await navigator.gpu.requestAdapter(opt);logDiag("GPU adapter "+(opt.powerPreference||"default")+": "+(adapter?"OK":"null"));if(adapter)break}catch(err){logDiag("GPU adapter "+(opt.powerPreference||"default")+": "+String(err?.message||err))}}if(adapter){logDiag("shader-f16: "+adapter.features.has("shader-f16"));logDiag("maxBufferSize: "+adapter.limits.maxBufferSize);try{const device=await adapter.requestDevice();logDiag("GPU device: OK");device.destroy()}catch(err){logDiag("GPU device: "+String(err?.message||err))}}else{logDiag("GPU事前検査: adapterなし。WebLLMの独自取得処理も試行します")}
status("AIライブラリを読み込み中…");
const lib=await import("https://esm.run/@mlc-ai/web-llm");logDiag("WebLLM import: OK");
status("新しいAIモデル（Qwen2.5 3B）を準備中…");
logDiag("Model: "+MODEL_ID);if(!lib.prebuiltAppConfig.model_list.some(m=>m.model_id===MODEL_ID))throw Error("このWebLLMバージョンには3Bモデルが登録されていません");const result=await lib.CreateMLCEngine(MODEL_ID,{initProgressCallback:p=>{const progress=typeof p.progress==="number"?p.progress*100:undefined;status(p.text||"AIモデルを読み込み中…",progress)}});
status("AIが実際に返答できるか確認中…");
try{
 const probe=await result.chat.completions.create({messages:[{role:"user",content:"こんにちは"}],max_tokens:12,temperature:0.2});
 if(!probe.choices?.[0]?.message?.content)throw Error("テスト応答が空でした");
}catch(e){
 const detail=String(e?.message||e);
 if(/Model not loaded|reload\(model\)/i.test(detail)){
  status("モデルを再読み込みして確認中…");
  await result.reload(MODEL_ID);
  const probe2=await result.chat.completions.create({messages:[{role:"user",content:"こんにちは"}],max_tokens:12});
  if(!probe2.choices?.[0]?.message?.content)throw Error("再読み込み後もテスト応答が空でした");
 }else{throw e}
}
logDiag("Chat generation probe: OK");engine=result;
el("overlay").hidden=true;el("busy").textContent="● 会話テスト成功・AI準備完了";
return engine;
})();
try{return await initPromise}catch(e){showError(e);throw e}finally{initPromise=null}
}
el("retry").addEventListener("click",()=>{initialize().catch(()=>{})});
el("settingsBtn").addEventListener("click",()=>{el("charName").value=data.name;el("persona").value=data.persona;el("settings").showModal()});
el("close").addEventListener("click",()=>el("settings").close());el("clearChat").addEventListener("click",()=>{if(!confirm("会話履歴をすべて削除しますか？"))return;data.messages=[];saveData();render();el("settings").close();});
el("save").addEventListener("click",()=>{data.name=el("charName").value.trim()||"アオ";data.persona=el("persona").value.trim();saveData();el("settings").close()});
async function recoverModel(){engine=null;el("busy").textContent="AIモデルを再読み込みしています…";return await initialize()}
async function completeWithRecovery(messages,options){let model=await initialize();try{return await model.chat.completions.create({messages,...options})}catch(e){if(!/Model not loaded|reload\(model\)|model.*not loaded/i.test(String(e?.message||e)))throw e;model=await recoverModel();return await model.chat.completions.create({messages,...options})}}
async function send(){const content=el("entry").value.trim();if(!content||working)return;working=true;el("send").disabled=true;el("entry").value="";data.messages.push({role:"user",content});saveData();render();el("busy").textContent="AIが考えています…";try{const examples=[{role:"user",content:"おはよ"},{role:"assistant",content:"おはよー！今日なにする？"},{role:"user",content:"きょーひま？"},{role:"assistant",content:"うん、ひまだよ！どうしたの？"},{role:"user",content:"あのさー"},{role:"assistant",content:"んー？なになに？"},{role:"user",content:"なんで？"},{role:"assistant",content:"え、どのこと？もうちょっと教えて！"}];
const prompt="あなたは「"+data.name+"」という架空のキャラクター。"+data.persona+"。日本語で友達とLINEするように話す。ユーザーの直前の発言に直接答える。短文なら短く返す。自己紹介、業務案内、サポート案内はしない。";
const result=await completeWithRecovery([{role:"system",content:prompt},...examples,...data.messages.slice(-10)],{temperature:0.7,top_p:0.9,repetition_penalty:1.12,max_tokens:120});
let reply=(result.choices?.[0]?.message?.content||"").trim();
const canned=/何かありましたら|お知らせください|お手伝い|申し訳ありません|質問に答えることができません|適切な対応を提供/;
if(!reply||canned.test(reply)){
const retry=await completeWithRecovery([{role:"system",content:prompt+"。返答は一言か二言だけ。会話文だけを出力する。"},...examples.slice(0,6),{role:"user",content}],{temperature:0.8,top_p:0.95,max_tokens:90});
reply=(retry.choices?.[0]?.message?.content||"").trim();
}
if(!reply||canned.test(reply))reply="ん、どうした？";
data.messages.push({role:"assistant",content:reply});saveData();render();el("busy").textContent="● AI準備完了"}catch(e){el("busy").textContent="エラー: "+(e?.message||e)}finally{working=false;el("send").disabled=false}}
el("send").addEventListener("click",send);
el("entry").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();send()}});
render();
initialize().catch(()=>{});
</script></body></html>
