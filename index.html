<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Character Chat</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}*{box-sizing:border-box}body{margin:0;background:#0c1020;color:#f6f7ff}button,input,textarea{font:inherit}button{border:0;border-radius:13px;padding:12px 16px;background:#465fe0;color:white;font-weight:650}button:disabled{opacity:.5}header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#181e35}header button{background:#303957}#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}#chat{flex:1;min-height:0;overflow:auto;padding:16px}article{white-space:pre-wrap;overflow-wrap:anywhere;max-width:86%;width:max-content;background:#272f4b;padding:12px 16px;border-radius:19px;margin:9px 0;line-height:1.55}article.user{background:#3755aa;margin-left:auto}footer{display:flex;gap:8px;padding:10px 12px;background:#181e35}footer input{min-width:0;flex:1;background:#2a304b;color:white;border:1px solid #535e81;border-radius:15px;padding:12px}#busy{font-size:12px;color:#b8c3e8;padding:4px 16px;min-height:23px}#overlay{position:fixed;inset:0;background:#0c1020;z-index:10;display:flex;align-items:center;justify-content:center;padding:25px}#overlay[hidden]{display:none}#panel{width:min(100%,420px);text-align:center}#logo{font-size:52px;margin-bottom:15px}h1{font-size:25px;margin:0 0 12px}#phase{color:#bac4e7;line-height:1.6;overflow-wrap:anywhere}progress{width:100%;height:12px;accent-color:#7185ff;margin:18px 0}#retry{margin-top:16px}#retry[hidden]{display:none}dialog{width:min(92vw,440px);background:#1b2239;color:white;border:1px solid #4d5879;border-radius:18px;padding:20px}dialog::backdrop{background:#0009}dialog input,dialog textarea{width:100%;margin:8px 0 16px;background:#2a304b;color:white;border:1px solid #536080;border-radius:10px;padding:10px}dialog textarea{height:100px}small{color:#aeb9db}
</style></head><body><div id="app"><header><strong>✦ Character Chat</strong><button id="settingsBtn">⚙ 設定</button></header><div id="chat" aria-live="polite"></div><div id="busy"></div><footer><input id="entry" placeholder="メッセージを入力" autocomplete="off"><button id="send">送信</button></footer></div>
<div id="overlay"><div id="panel"><div id="logo">✦</div><h1>Character Chat</h1><p id="phase">AIの起動を準備しています…</p><progress id="progress" max="100"></progress><div><small id="detail">初回はモデルのダウンロードが必要です</small></div><button id="retry" hidden>もう一度試す</button></div></div>
<dialog id="settings"><h2>キャラクター設定</h2><label>名前<input id="charName"></label><label>性格・口調<textarea id="persona"></textarea></label><button id="save">保存</button> <button id="close">閉じる</button><p><small>会話履歴はこのSafariに保存されます。閲覧データを削除すると失われる場合があります。</small></p></dialog>
<script type="module">
const el=id=>document.getElementById(id);
const KEY="character-chat-v1";
let data;
try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{data={}}
if(!Array.isArray(data.messages))data.messages=[];
const obsolete=/AIを読み込んでください|AIを読み込む.*押して|AIが未読み込みです|先に設定から/;
data.messages=data.messages.filter(m=>!(m.role==="assistant"&&obsolete.test(m.content||"")));
try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}
data.name=data.name||"アオ";
data.persona=data.persona||"明るく親しみやすく、日本語で自然に会話する。";
let engine=null,initPromise=null,working=false;
function saveData(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){el("busy").textContent="履歴の保存に失敗しました: "+e.message}}
function render(){el("chat").replaceChildren();for(const m of data.messages){const a=document.createElement("article");a.className=m.role==="user"?"user":"assistant";a.textContent=m.content;el("chat").append(a)}el("chat").scrollTop=el("chat").scrollHeight}
function status(msg,percent){el("phase").textContent=msg;if(Number.isFinite(percent)){el("progress").value=Math.min(100,Math.max(0,percent))}else{el("progress").removeAttribute("value")}}
function showError(e){el("overlay").hidden=false;status("AIの起動に失敗しました");el("detail").textContent=String(e?.message||e);el("retry").hidden=false;el("progress").hidden=true;el("retry").disabled=false}
async function initialize(){
if(engine)return engine;
if(initPromise)return initPromise;
el("overlay").hidden=false;el("retry").hidden=true;el("progress").hidden=false;el("detail").textContent="Safariを開いたままお待ちください";status("ブラウザの対応状況を確認中…");
initPromise=(async()=>{
if(!navigator.gpu)throw Error("WebGPUが利用できません。SafariとiOSの対応状況を確認してください。");
status("AIライブラリを読み込み中…");
const lib=await import("https://esm.run/@mlc-ai/web-llm");
status("AIモデルを準備中…");
const result=await lib.CreateMLCEngine("Qwen2.5-0.5B-Instruct-q4f16_1-MLC",{initProgressCallback:p=>{const progress=typeof p.progress==="number"?p.progress*100:undefined;status(p.text||"AIモデルを読み込み中…",progress)}});
engine=result;
el("overlay").hidden=true;el("busy").textContent="● AI準備完了";
return engine;
})();
try{return await initPromise}catch(e){showError(e);throw e}finally{initPromise=null}
}
el("retry").addEventListener("click",()=>{initialize().catch(()=>{})});
el("settingsBtn").addEventListener("click",()=>{el("charName").value=data.name;el("persona").value=data.persona;el("settings").showModal()});
el("close").addEventListener("click",()=>el("settings").close());
el("save").addEventListener("click",()=>{data.name=el("charName").value.trim()||"アオ";data.persona=el("persona").value.trim();saveData();el("settings").close()});
async function send(){const content=el("entry").value.trim();if(!content||working)return;working=true;el("send").disabled=true;el("entry").value="";data.messages.push({role:"user",content});saveData();render();el("busy").textContent="AIが考えています…";try{const model=await initialize();const result=await model.chat.completions.create({messages:[{role:"system",content:"あなたは"+data.name+"。"+data.persona+" 日本語で自然に返答する。AIの読み込みや設定操作を促す定型文は会話に混ぜない。"},...data.messages.slice(-16)],max_tokens:180});data.messages.push({role:"assistant",content:result.choices?.[0]?.message?.content||"返事を生成できませんでした。"});saveData();render();el("busy").textContent="● AI準備完了"}catch(e){el("busy").textContent="エラー: "+(e?.message||e)}finally{working=false;el("send").disabled=false}}
el("send").addEventListener("click",send);
el("entry").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();send()}});
render();
initialize().catch(()=>{});
</script></body></html>
