<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character Chat</title><style>body{margin:0;background:#0e1020;color:#f6f7ff;font:16px system-ui}header{padding:18px;background:#191d35;display:flex;justify-content:space-between}main{height:calc(100dvh - 150px);overflow:auto;padding:18px}article{background:#272d49;border-radius:18px;padding:13px;margin:10px 0;max-width:85%;white-space:pre-wrap}article.me{background:#3653a6;margin-left:auto}footer{display:flex;padding:12px;gap:8px}input,button,textarea{background:#262b47;color:white;border:1px solid #48506e;border-radius:12px;padding:12px;font:inherit}input{flex:1;min-width:0}button{cursor:pointer}dialog{background:#191d35;color:white;border:1px solid #505a80;border-radius:16px;width:85%}textarea{width:90%;height:100px}</style><header><strong>✦ Character Chat</strong><button onclick="document.getElementById('settings').showModal()">⚙ 設定</button></header><main id="messages"></main><footer><input id="entry" placeholder="メッセージを入力"><button id="send">送信</button></footer><dialog id="settings"><h3>キャラクター設定</h3><p>名前</p><input id="name" value="アオ"><p>性格・口調</p><textarea id="persona">明るく、親しみやすい。日本語で短めに話す。</textarea><p><button onclick="saveSettings()">保存</button> <button onclick="loadAI()">AIを読み込む</button></p><small id="status">AI未読み込み</small><p><small>ページを更新するとAIは再読み込みが必要です。</small></p><p><button onclick="document.getElementById('settings').close()">閉じる</button></p></dialog><script type="module">const $=id=>document.getElementById(id), key="character-chat-v1";let state=JSON.parse(localStorage.getItem(key)||'{"messages":[]}'),engine=null,loadingPromise=null;$("name").value=state.name||"アオ";$("persona").value=state.persona||"明るく親しみやすい";function persist(){localStorage.setItem(key,JSON.stringify(state))}function render(){$("messages").innerHTML="";for(const m of state.messages){const a=document.createElement("article");a.className=m.role==="user"?"me":"";a.textContent=m.content;$("messages").append(a)}$("messages").scrollTop=$("messages").scrollHeight}window.saveSettings=()=>{state.name=$("name").value;state.persona=$("persona").value;persist();$("settings").close()};async function ensureAI(){if(engine)return engine;if(loadingPromise)return loadingPromise;loadingPromise=(async()=>{const status=$("status");status.textContent="AIを起動しています…";if(!navigator.gpu)throw Error("WebGPUが利用できません");const webllm=await import("https://esm.run/@mlc-ai/web-llm");const loaded=await webllm.CreateMLCEngine("Qwen2.5-0.5B-Instruct-q4f16_1-MLC",{initProgressCallback:p=>{status.textContent=p.text||"AI読み込み中…"}});engine=loaded;status.textContent="AI準備完了";return loaded})();try{return await loadingPromise}catch(e){$("status").textContent="読み込みエラー: "+e.message;throw e}finally{loadingPromise=null}}window.loadAI=async()=>{try{await ensureAI()}catch(e){alert("AIの読み込みに失敗しました: "+e.message)}};$("send").onclick=async()=>{const content=$("entry").value.trim();if(!content)return;$("entry").value="";state.messages.push({role:"user",content});persist();render();$("send").disabled=true;try{const activeEngine=await ensureAI();const r=await activeEngine.chat.completions.create({messages:[{role:"system",content:"あなたは"+(state.name||"アオ")+"。"+(state.persona||"")+"。日本語で会話する。"},...state.messages.slice(-16)],max_tokens:180});state.messages.push({role:"assistant",content:r.choices[0].message.content||"…"})}catch(e){state.messages.push({role:"assistant",content:"生成エラー: "+e.message+"（設定画面でも状態を確認できます）})}persist();render();$("send").disabled=false};$("entry").addEventListener("keydown",e=>{if(e.key==="Enter")$("send").click()});render();</script></html>
